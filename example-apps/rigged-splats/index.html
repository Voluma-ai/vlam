<!doctype html>
<!-- Live runner for site/examples/rigged-splats.md. See first-viewer/index.html. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Rig and animate splats. VLAM! example</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1a1a1f;
        font: 14px/1.4 system-ui, sans-serif;
      }
      canvas {
        touch-action: none;
      }
      #controls {
        position: fixed;
        bottom: 16px;
        left: 16px;
        right: 16px;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        color: #fff;
        text-shadow: 0 1px 4px #000;
      }
      #status {
        position: fixed;
        top: 12px;
        left: 16px;
        color: #ccc;
        text-shadow: 0 1px 4px #000;
      }
    </style>
  </head>
  <body>
    <div id="status">Loading…</div>
    <div id="controls">
      <button id="look" type="button">Look around</button>
      <button id="walk" type="button">Walk</button>
      <button id="honk" type="button">Honk</button>
      <label
        >Speed
        <select id="speed">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
        </select></label
      >
    </div>
    <script type="module" src="../../docs/examples/samples/rigged-splats.ts"></script>
  </body>
</html>
