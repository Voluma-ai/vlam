<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>VLAM backend probe</title>
  <canvas id="canvas" width="4" height="4"></canvas>
  <output data-testid="backend"></output>
  <output data-testid="pixel"></output>
  <output data-testid="projection"></output>
  <output data-testid="empty-pixel"></output>
  <output data-testid="pool-uploads"></output>
  <output data-testid="pool-timing"></output>
  <script type="module">
    import * as THREE from 'three/webgpu';
    import { createWebGPURenderer, SplatMesh } from '../lib/core';
    import { packShCoefficients, shCoefficientCount } from '../lib/core/sh-pack';
    import { computeProjection } from '../lib/projection/compute';

    const params = new URLSearchParams(location.search);
    const requested = params.get('backend');
    const projectionParam = params.get('projection') ?? 'vertex';
    if (projectionParam !== 'vertex' && projectionParam !== 'compute') {
      throw new Error(`Unknown projection: ${projectionParam}`);
    }
    const projectionStrategy =
      projectionParam === 'compute' ? computeProjection() : 'vertex';
    const dynamic = params.get('dynamic');
    const capacity = Number(params.get('capacity') ?? '2048');
    const bands = Number(params.get('bands') ?? '0');
    const floatTextures = params.get('float16') === '1' ? 'float16' : 'float32';
    const canvas = document.querySelector('#canvas');
    const backend = document.querySelector('[data-testid="backend"]');
    const pixel = document.querySelector('[data-testid="pixel"]');
    const projectionOutput = document.querySelector('[data-testid="projection"]');
    addEventListener('error', (event) => {
      projectionOutput.textContent = JSON.stringify({ error: String(event.error ?? event.message) });
    });
    addEventListener('unhandledrejection', (event) => {
      projectionOutput.textContent = JSON.stringify({ error: String(event.reason) });
    });
    if (requested !== 'webgpu' && requested !== 'webgl2') {
      throw new Error(`Unknown backend: ${requested}`);
    }

    const renderer = await createWebGPURenderer({
      canvas,
      antialias: false,
      forceWebGL: requested === 'webgl2',
      requireWebGpu: requested === 'webgpu',
    });
    renderer.setSize(5, 5, false);
    await renderer.init();
    const actual = renderer.backend.isWebGPUBackend ? 'webgpu' : 'webgl2';
    if (actual !== requested) throw new Error(`Requested ${requested}, initialized ${actual}.`);

    const splatData = {
        count: 1,
        positions: new Float32Array([0, 0, 0]),
        colors: new Uint8Array([255, 255, 255, 255]),
        covariances: new Float32Array([0.04, 0, 0, 0.04, 0, 0.04]),
      };
    if (dynamic && bands > 0) {
      splatData.shPacked = packShCoefficients(
        new Float32Array(shCoefficientCount(bands) * 3),
        1,
        bands,
        1,
      );
    }
    const poolStart = performance.now();
    const splats = new SplatMesh(
      dynamic ? { capacity } : splatData,
      { projectionStrategy, shBands: bands, poolFloatTextures: floatTextures },
    );
    let destinationUploads = 0;
    if (dynamic) {
      document.querySelector('[data-testid="pool-timing"]').textContent = JSON.stringify({
        capacity,
        constructorMs: performance.now() - poolStart,
      });
      const pool = splats.pool;
      const destinations = new Set([
        pool.centersTexture,
        pool.colorsTexture,
        pool.covarianceATexture,
        pool.covarianceBTexture,
        ...pool.shPackedTextures,
      ]);
      const updateTexture = renderer.backend.updateTexture;
      renderer.backend.updateTexture = function (texture, ...rest) {
        if (destinations.has(texture)) destinationUploads++;
        return updateTexture.call(this, texture, ...rest);
      };
      document.querySelector('[data-testid="pool-uploads"]').textContent = JSON.stringify({
        dataReady: [...destinations].map((texture) => texture.source.dataReady),
        destinationUploads,
      });
    }
    const scene = new THREE.Scene();
    scene.add(splats);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 10);
    camera.position.z = 2;
    camera.updateMatrixWorld();
    const target = new THREE.RenderTarget(5, 5, { type: THREE.UnsignedByteType });
    renderer.setRenderTarget(target);
    renderer.setClearColor(0x000000, 0);
    if (dynamic === 'after') {
      splats.update(camera, renderer);
      renderer.clear();
      renderer.render(scene, camera);
      const empty = await renderer.readRenderTargetPixelsAsync(target, 2, 2, 1, 1);
      document.querySelector('[data-testid="empty-pixel"]').textContent = Array.from(empty).join(',');
    }
    if (dynamic) splats.appendRange(splatData);
    let bytes = new Uint8Array(4);
    // Worker-sorted paths intentionally reveal their first scene only after
    // its snapshot has an order. Give the probe a few render-preparation
    // frames rather than sampling the documented zero-instance first frame.
    for (let attempt = 0; attempt < 30; attempt++) {
      splats.update(camera, renderer);
      renderer.clear();
      renderer.render(scene, camera);
      bytes = await renderer.readRenderTargetPixelsAsync(target, 2, 2, 1, 1);
      if (bytes[3] > 0) break;
      await new Promise((resolve) => setTimeout(resolve, 10));
    }
    renderer.setRenderTarget(null);
    backend.textContent = actual;
    pixel.textContent = Array.from(bytes).join(',');
    if (dynamic) {
      const timing = JSON.parse(document.querySelector('[data-testid="pool-timing"]').textContent);
      document.querySelector('[data-testid="pool-timing"]').textContent = JSON.stringify({
        ...timing,
        firstUsableMs: performance.now() - poolStart,
      });
    }
    projectionOutput.textContent = JSON.stringify({
      ...splats.projectionStrategyStatus,
      visibleCount: await splats.readGpuVisibleSplatCount(),
    });
    if (dynamic) {
      document.querySelector('[data-testid="pool-uploads"]').textContent = JSON.stringify({
        dataReady: [
          splats.pool.centersTexture,
          splats.pool.colorsTexture,
          splats.pool.covarianceATexture,
          splats.pool.covarianceBTexture,
          ...splats.pool.shPackedTextures,
        ].map((texture) => texture.source.dataReady),
        destinationUploads,
      });
    }
    target.dispose();
    splats.dispose();
    renderer.dispose();
  </script>
</html>
