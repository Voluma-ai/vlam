<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Rendering math regression probe</title>
  <output id="result"></output>
  <script type="module">
    import * as THREE from 'three/webgpu';
    import { float } from 'three/tsl';
    import { SplatMesh, createWebGPURenderer } from '../lib/core';
    import { UnifiedSplatMesh } from '../lib/unified';

    const webgl = new URLSearchParams(location.search).get('backend') === 'webgl2';
    const renderer = await createWebGPURenderer({ antialias: false, forceWebGL: webgl });
    await renderer.init();
    const programs = [];
    const createProgram = renderer.backend.createProgram.bind(renderer.backend);
    renderer.backend.createProgram = (program) => {
      programs.push({ stage: program.stage, code: program.code });
      return createProgram(program);
    };
    let computeCalls = 0;
    const compute = renderer.compute.bind(renderer);
    renderer.compute = (...args) => { computeCalls++; return compute(...args); };
    renderer.setSize(64, 64);
    renderer.setClearColor(0, 0);
    document.body.appendChild(renderer.domElement);
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 10);
    camera.position.z = 2;
    const target = new THREE.RenderTarget(64, 64, { type: THREE.UnsignedByteType });
    const cases = [
      { name: 'axis' },
      { name: 'axis-aligned', diagonal: true },
      { name: 'dense', count: 512 },
      { name: 'anisotropic', transform: true },
      { name: 'antialias', antialias: true },
      { name: 'lcc', projectedFilterProfile: 'lcc' },
      { name: 'dof', aperture: 0.2 },
      { name: 'dof-aa', aperture: 0.2, antialias: true },
      { name: 'dof-lcc', aperture: 0.2, projectedFilterProfile: 'lcc' },
      { name: 'rad-leaf', lodAlpha: true, alpha: 90 },
      { name: 'rad-merged', lodAlpha: true, alpha: 210 },
      { name: 'fade', fade: 0.35, lodAlpha: true, alpha: 210 },
      { name: 'isotropic', isotropic: true },
      { name: 'sh', sh: true },
      { name: 'edge', x: 1.1 },
      { name: 'behind', z: 3 },
      { name: 'far', z: -12 },
    ];
    const results = [];
    for (const unified of webgl ? [false] : [false, true]) {
      for (const config of cases.filter(config => !new URLSearchParams(location.search).has('benchmarkOnly') || config.count)) {
        const count = config.count ?? 1;
        const data = {
          count,
          positions: new Float32Array([config.x ?? 0, 0, config.z ?? 0]),
          colors: new Uint8Array([190, 110, 60, config.alpha ?? 230]),
          covariances: new Float32Array(config.diagonal ? [0.03, 0, 0, 0.012, 0, 0.008] : [0.03, 0.007, 0.002, 0.012, 0.003, 0.008]),
          ...(config.sh ? { sh: { bands: 1, labels: new Uint32Array(1), palette: new Float32Array(192 * 4).fill(0.1), paletteWidth: 192, paletteHeight: 1 } } : {}),
        };
        if (count > 1) {
          data.positions = new Float32Array(count * 3);
          data.colors = new Uint8Array(count * 4);
          data.covariances = new Float32Array(count * 6);
          for (let i = 0; i < count; i++) {
            data.positions.set([Math.sin(i * 2.4) * 0.65, Math.cos(i * 1.7) * 0.65, (i / count) * 0.3], i * 3);
            data.colors.set([190, 110, 60, 160], i * 4);
            data.covariances.set([0.003, 0.0007, 0.0002, 0.0012, 0.0003, 0.0008], i * 6);
          }
        }
        const programStart = programs.length;
        const computeStart = computeCalls;
        const mesh = new SplatMesh(data, {
          orientation: 'source', shEvaluation: 'vertex', performanceProfile: 'quality',
          antialias: config.antialias ?? false,
          projectedFilterProfile: config.projectedFilterProfile ?? 'default',
          lodAlpha: config.lodAlpha ?? false,
        });
        if (config.transform) { mesh.scale.set(1.4, 0.7, 1.1); mesh.rotation.set(0.2, 0.3, 0.4); }
        if (config.isotropic || config.fade) mesh.modifiers = [(ctx) => ({
          color: config.fade ? ctx.color.mul(float(config.fade)) : ctx.color,
          ...(config.isotropic ? { isotropicCovarianceMix: float(1), isotropicScreenRadiusPx: float(2) } : {}),
        })];
        const drawMesh = unified ? new UnifiedSplatMesh(renderer, 2048) : mesh;
        if (unified) drawMesh.addSource(mesh);
        drawMesh.setDepthOfField({ focusDistance: 1, aperture: config.aperture ?? 0 });
        const scene = new THREE.Scene();
        scene.add(drawMesh);
        const draw = () => {
          renderer.setRenderTarget(target);
          drawMesh.update(camera, renderer);
          renderer.clear();
          renderer.render(scene, camera);
        };
        // Let worker/module setup finish before reading deterministic output.
        for (let i = 0; i < 4; i++) { draw(); await new Promise(r => setTimeout(r, 30)); }
        const pixels = Array.from(await renderer.readRenderTargetPixelsAsync(target, 0, 0, 64, 64));
        renderer.setRenderTarget(null);
        const hit = unified
          ? await drawMesh.pick(new THREE.Vector2(0, 0), camera)
          : await mesh.pick(new THREE.Vector2(0, 0), camera, renderer);
        const timings = {};
        if (config.count) {
          for (const motion of ['stationary', 'orbit']) {
            const samples = [];
            for (let i = 0; i < 20; i++) {
              if (motion === 'orbit') { const angle = i * 0.025; camera.position.set(2 * Math.sin(angle), 0, 2 * Math.cos(angle)); camera.lookAt(0, 0, 0); }
              const start = performance.now();
              draw();
              await renderer.readRenderTargetPixelsAsync(target, 0, 0, 1, 1);
              samples.push(performance.now() - start);
            }
            timings[motion] = samples;
          }
          camera.position.set(0, 0, 2); camera.lookAt(0, 0, 0);
        }
        results.push({ name: config.name, unified, pixels, hit: hit ? hit.point.toArray() : null, programs: programs.slice(programStart), computeCalls: computeCalls - computeStart, timings });
        drawMesh.dispose();
        if (unified) mesh.dispose();
      }
    }
    renderer.setRenderTarget(null);
    target.dispose();
    renderer.dispose();
    document.querySelector('#result').textContent = JSON.stringify({ backend: webgl ? 'webgl2' : 'webgpu', results });
  </script>
</html>
