<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Rendering math regression probe</title>
  <output id="result"></output>
  <script type="module">
    import * as THREE from 'three/webgpu';
    import { float } from 'three/tsl';
    import { SplatPool } from '../lib/core/splat-mesh-pool';
    import { SplatMesh, createWebGPURenderer } from '../lib/core';
    import { UnifiedSplatMesh } from '../lib/unified';
    import { worldWarpPreset } from '../lib/effects';
    import { attachRelighting } from '../lib/relighting';
    import { parseRad } from '../lib/formats/rad';

    function radLeaf(alpha) {
      const values = [['center', [0, 0, 0]], ['alpha', [alpha]], ['rgb', [190/255, 110/255, 60/255]], ['scales', [0.15, 0.11, 0.09]], ['orientation', [0, 0, 0]]];
      let offset = 0;
      const properties = values.map(([property, value]) => {
        const entry = { property, encoding: 'f32', offset, bytes: value.length * 4 };
        offset += entry.bytes;
        return entry;
      });
      const json = new TextEncoder().encode(JSON.stringify({ version: 1, base: 0, count: 1, payloadBytes: offset, properties }));
      const padded = Math.ceil(json.length / 8) * 8;
      const bytes = new Uint8Array(8 + padded + 8 + offset);
      const view = new DataView(bytes.buffer);
      view.setUint32(0, 0x43444152, true); view.setUint32(4, json.length, true);
      bytes.set(json, 8); view.setBigUint64(8 + padded, BigInt(offset), true);
      let at = 8 + padded + 8;
      for (const [, value] of values) for (const number of value) { view.setFloat32(at, number, true); at += 4; }
      return bytes.buffer;
    }

    // Independent CPU reference: bake the view-space hinge into centers and covariance.
    function bakeWarp(data, matrix, intensity) {
      const v = new THREE.Vector3().fromArray(data.positions).applyMatrix4(matrix);
      v.z -= 2;
      const depth = Math.max(0, -v.z), R = 4;
      const angle = Math.atan(depth / R) * Math.PI * 0.5;
      const c = Math.cos(angle), s = Math.sin(angle) * (intensity > 0 ? -1 : 1);
      const w = Math.abs(intensity);
      const warped = new THREE.Vector3(v.x, v.y * c - v.z * s, v.y * s + v.z * c);
      const hinge = intensity > 0 ? 1 : -1;
      const derivative = v.z < 0 ? hinge * (Math.PI * 0.5 * R) / (depth * depth + R * R) : 0;
      const r0 = new THREE.Vector3(1, 0, 0);
      const r1 = new THREE.Vector3(0, 1-w+w*c, w*s).normalize();
      const r2 = new THREE.Vector3(0, w*(-s-warped.z*derivative), 1-w+w*(c+warped.y*derivative));
      r2.addScaledVector(r1, -r2.dot(r1)).normalize();
      const q = new THREE.Matrix3().set(r0.x, r1.x, r2.x, r0.y, r1.y, r2.y, r0.z, r1.z, r2.z);
      const A = new THREE.Matrix3().setFromMatrix4(matrix);
      const B = q.multiply(A);
      const cov = data.covariances;
      const sigma = new THREE.Matrix3().set(cov[0], cov[1], cov[2], cov[1], cov[3], cov[4], cov[2], cov[4], cov[5]);
      const result = B.clone().multiply(sigma).multiply(B.clone().transpose()).elements;
      data.covariances.set([result[0], result[3], result[6], result[4], result[7], result[8]]);
      data.positions.set(v.lerp(warped, w).add(new THREE.Vector3(0, 0, 2)).toArray());
    }

    const webgl = new URLSearchParams(location.search).get('backend') === 'webgl2';
    const renderer = await createWebGPURenderer({ antialias: false, forceWebGL: webgl });
    await renderer.init();
    const programs = [];
    const createProgram = renderer.backend.createProgram.bind(renderer.backend);
    renderer.backend.createProgram = (program) => {
      programs.push({ stage: program.stage, code: program.code });
      return createProgram(program);
    };
    let computeCalls = 0;
    const compute = renderer.compute.bind(renderer);
    renderer.compute = (...args) => { computeCalls++; return compute(...args); };
    renderer.setSize(64, 64);
    renderer.setClearColor(0, 0);
    document.body.appendChild(renderer.domElement);
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 10);
    camera.position.z = 2;
    const target = new THREE.RenderTarget(64, 64, { type: THREE.UnsignedByteType });
    const cases = [
      { name: 'axis' },
      { name: 'rad-whole-zero', radAlpha: 0 },
      { name: 'rad-whole-translucent', radAlpha: 0.3 },
      { name: 'rad-whole-opaque', radAlpha: 1 },
      { name: 'rad-reference', radReference: true },
      { name: 'warp-zero', warp: 0 },
      { name: 'warp-zero-baked', warp: 0, baked: true },
      { name: 'warp-planet', warp: 0.2 },
      { name: 'warp-planet-baked', warp: 0.2, baked: true },
      { name: 'warp-fold', warp: -0.2 },
      { name: 'warp-fold-baked', warp: -0.2, baked: true },
      { name: 'relight-default', relight: 'default' },
      { name: 'relight-one', relight: 1 },
      { name: 'relight-zero', relight: 0 },
      { name: 'axis-aligned', diagonal: true },
      { name: 'dense', count: 512 },
      { name: 'anisotropic', transform: true },
      { name: 'antialias', antialias: true },
      { name: 'lcc', projectedFilterProfile: 'lcc' },
      { name: 'dof', aperture: 0.2 },
      { name: 'dof-aa', aperture: 0.2, antialias: true },
      { name: 'dof-lcc', aperture: 0.2, projectedFilterProfile: 'lcc' },
      { name: 'rad-leaf', lodAlpha: true, alpha: 90 },
      { name: 'rad-merged', lodAlpha: true, alpha: 210 },
      { name: 'fade', fade: 0.35, lodAlpha: true, alpha: 210 },
      { name: 'isotropic', isotropic: true },
      { name: 'sh', sh: true },
      { name: 'edge', x: 1.1 },
      { name: 'behind', z: 3 },
      { name: 'far', z: -12 },
    ];
    const results = [];
    for (const unified of webgl ? [false] : [false, true]) {
      for (const config of cases.filter(config => !new URLSearchParams(location.search).has('benchmarkOnly') || config.count)) {
        const count = config.count ?? 1;
        let data = {
          count,
          positions: new Float32Array([config.x ?? 0, 0, config.z ?? 0]),
          colors: new Uint8Array([190, 110, 60, config.alpha ?? 230]),
          covariances: new Float32Array(config.diagonal ? [0.03, 0, 0, 0.012, 0, 0.008] : [0.03, 0.007, 0.002, 0.012, 0.003, 0.008]),
          ...(config.sh ? { sh: { bands: 1, labels: new Uint32Array(1), palette: new Float32Array(192 * 4).fill(0.1), paletteWidth: 192, paletteHeight: 1 } } : {}),
        };
        if (count > 1) {
          data.positions = new Float32Array(count * 3);
          data.colors = new Uint8Array(count * 4);
          data.covariances = new Float32Array(count * 6);
          for (let i = 0; i < count; i++) {
            data.positions.set([Math.sin(i * 2.4) * 0.65, Math.cos(i * 1.7) * 0.65, (i / count) * 0.3], i * 3);
            data.colors.set([190, 110, 60, 160], i * 4);
            data.covariances.set([0.003, 0.0007, 0.0002, 0.0012, 0.0003, 0.0008], i * 6);
          }
        }
        if (config.radAlpha !== undefined) data = await parseRad(radLeaf(config.radAlpha));
        if (config.radReference) {
          data = await parseRad(radLeaf(1));
          data.colors[3] = 255;
        }
        const warpMatrix = new THREE.Matrix4().compose(new THREE.Vector3(), new THREE.Quaternion().setFromEuler(new THREE.Euler(0.2, -0.3, 0.15)), new THREE.Vector3(1.7, 0.6, 1.2));
        if (config.warp !== undefined) {
          data.positions.set([0, 0.12, -0.2]);
          if (config.baked) bakeWarp(data, warpMatrix, config.warp);
        }
        const programStart = programs.length;
        const computeStart = computeCalls;
        const mesh = new SplatMesh(data, {
          orientation: 'source', shEvaluation: 'vertex', performanceProfile: 'quality',
          antialias: config.antialias ?? false,
          projectedFilterProfile: config.projectedFilterProfile ?? 'default',
          lodAlpha: config.lodAlpha ?? false,
        });
        const warp = config.warp !== undefined && !config.baked ? worldWarpPreset({ intensity: 0, radius: 4 }) : null;
        if (warp) {
          warpMatrix.decompose(mesh.position, mesh.quaternion, mesh.scale);
          mesh.modifiers = [warp.modifier];
          mesh.updateMatrixWorld();
        }
        if (config.transform) { mesh.scale.set(1.4, 0.7, 1.1); mesh.rotation.set(0.2, 0.3, 0.4); }
        if (config.isotropic || config.fade) mesh.modifiers = [(ctx) => ({
          color: config.fade ? ctx.color.mul(float(config.fade)) : ctx.color,
          ...(config.isotropic ? { isotropicCovarianceMix: float(1), isotropicScreenRadiusPx: float(2) } : {}),
        })];
        const drawMesh = unified
          ? new UnifiedSplatMesh(renderer, 2048, { performanceProfile: 'quality' })
          : mesh;
        if (unified) drawMesh.addSource(mesh);
        const map = config.relight !== undefined ? new THREE.DataTexture(new Uint8Array([64, 64, 64, 255]), 1, 1) : null;
        if (map) map.needsUpdate = true;
        const relight = map ? attachRelighting(drawMesh, { map, ...(config.relight === 'default' ? {} : { blend: config.relight }) }) : null;
        drawMesh.setDepthOfField({ focusDistance: 1, aperture: config.aperture ?? 0 });
        const scene = new THREE.Scene();
        scene.add(drawMesh);
        const draw = () => {
          renderer.setRenderTarget(target);
          drawMesh.update(camera, renderer);
          renderer.clear();
          renderer.render(scene, camera);
        };
        // Let worker/module setup finish before reading deterministic output.
        for (let i = 0; i < 4; i++) { draw(); await new Promise(r => setTimeout(r, 30)); }
        let initialPixels = null, restoredPixels = null, updatedPixels = null;
        if (warp) {
          initialPixels = Array.from(await renderer.readRenderTargetPixelsAsync(target, 0, 0, 64, 64));
          warp.intensity.value = config.warp;
          draw();
        }
        const pixels = Array.from(await renderer.readRenderTargetPixelsAsync(target, 0, 0, 64, 64));
        if (warp) {
          warp.intensity.value = 0; draw();
          restoredPixels = Array.from(await renderer.readRenderTargetPixelsAsync(target, 0, 0, 64, 64));
          warp.intensity.value = config.warp; draw();
        }
        if (relight) {
          relight.update({ blend: config.relight === 0 ? 1 : 0 }); draw();
          updatedPixels = Array.from(await renderer.readRenderTargetPixelsAsync(target, 0, 0, 64, 64));
        }
        renderer.setRenderTarget(null);
        const hit = unified
          ? await drawMesh.pick(new THREE.Vector2(0, 0), camera)
          : await mesh.pick(new THREE.Vector2(0, 0), camera, renderer);
        const timings = {};
        if (config.count) {
          for (const motion of ['stationary', 'orbit']) {
            const samples = [];
            for (let i = 0; i < 20; i++) {
              if (motion === 'orbit') { const angle = i * 0.025; camera.position.set(2 * Math.sin(angle), 0, 2 * Math.cos(angle)); camera.lookAt(0, 0, 0); }
              const start = performance.now();
              draw();
              await renderer.readRenderTargetPixelsAsync(target, 0, 0, 1, 1);
              samples.push(performance.now() - start);
            }
            timings[motion] = samples;
          }
          camera.position.set(0, 0, 2); camera.lookAt(0, 0, 0);
        }
        results.push({ name: config.name, unified, pixels, initialPixels, restoredPixels, updatedPixels, hit: hit ? hit.point.toArray() : null, programs: programs.slice(programStart), computeCalls: computeCalls - computeStart, timings });
        relight?.dispose(); map?.dispose();
        drawMesh.dispose();
        if (unified) mesh.dispose();
      }
      const pool = new SplatPool({ capacity: 8192 });
      const plain = { count: 1, positions: new Float32Array([0.3, 0, 0]), colors: new Uint8Array([70, 170, 240, 255]), covariances: new Float32Array([0.015, 0, 0, 0.01, 0, 0.006]) };
      const hole = new SplatMesh(plain, { pool, orientation: 'source' });
      const rad = await parseRad(radLeaf(0.7));
      rad.positions[0] = -0.3;
      const left = new SplatMesh(rad, { pool, orientation: 'source', antialias: false });
      const right = new SplatMesh(plain, { pool, orientation: 'source', antialias: false });
      const scene = new THREE.Scene();
      const combined = unified ? new UnifiedSplatMesh(renderer, 8192) : null;
      if (combined) { combined.addSource(left); combined.addSource(right); scene.add(combined); }
      else { scene.add(left); scene.add(right); }
      const capture = async name => {
        for (let i = 0; i < 4; i++) {
          renderer.setRenderTarget(target);
          if (combined) combined.update(camera, renderer);
          else { left.update(camera, renderer); right.update(camera, renderer); }
          renderer.clear(); renderer.render(scene, camera);
          await new Promise(resolve => setTimeout(resolve, 30));
        }
        const pixels = Array.from(await renderer.readRenderTargetPixelsAsync(target, 0, 0, 64, 64));
        const ndc = new THREE.Vector3(-0.3, 0, 0).project(camera);
        renderer.setRenderTarget(null);
        const hit = combined ? await combined.pick(new THREE.Vector2(ndc.x, ndc.y), camera) : name === 'mixed-removed' ? null : await left.pick(new THREE.Vector2(ndc.x, ndc.y), camera, renderer);
        results.push({ name, unified, pixels, hit: hit ? hit.point.toArray() : null });
      };
      await capture('mixed-before');
      hole.dispose(); pool.compact();
      await capture('mixed-compacted');
      if (combined) combined.removeSource(left);
      else scene.remove(left);
      left.dispose();
      await capture('mixed-removed');
      combined?.dispose(); right.dispose(); pool.dispose();
    }
    const pickOwnership = [];
    if (!webgl) {
      const data = { count: 1, positions: new Float32Array(3), colors: new Uint8Array([255, 255, 255, 255]), covariances: new Float32Array([0.01, 0, 0, 0.01, 0, 0.01]) };
      const mesh = new SplatMesh(data, { orientation: 'source' });
      const scene = new THREE.Scene();
      scene.add(mesh);
      const combined = new UnifiedSplatMesh(renderer, 2048);
      const draw = () => {
        renderer.setRenderTarget(target);
        if (mesh.visible) mesh.update(camera, renderer);
        else combined.update(camera, renderer);
        renderer.clear(); renderer.render(scene, camera);
      };
      draw();
      pickOwnership.push((await mesh.pick(new THREE.Vector2(), camera, renderer))?.point.toArray() ?? null);
      combined.addSource(mesh);
      scene.add(combined);
      draw();
      pickOwnership.push((await combined.pick(new THREE.Vector2(), camera))?.point.toArray() ?? null);
      combined.removeSource(mesh);
      scene.remove(combined);
      draw();
      pickOwnership.push((await mesh.pick(new THREE.Vector2(), camera, renderer))?.point.toArray() ?? null);
      combined.dispose(); mesh.dispose();
    }
    renderer.setRenderTarget(null);
    target.dispose();
    renderer.dispose();
    const captures = document.createElement('div');
    captures.id = 'captures';
    captures.style.cssText = 'display:grid;grid-template-columns:repeat(8,80px);gap:8px;background:#222;padding:12px;color:white;width:max-content';
    for (const result of results) {
      if (!['rad-whole-translucent', 'rad-whole-opaque', 'warp-planet', 'warp-planet-baked', 'warp-fold', 'warp-fold-baked', 'relight-default', 'relight-zero', 'mixed-before', 'mixed-compacted', 'mixed-removed'].includes(result.name)) continue;
      const card = document.createElement('div');
      const canvas = document.createElement('canvas'); canvas.width = canvas.height = 64;
      canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(result.pixels), 64, 64), 0, 0);
      const label = document.createElement('div'); label.style.cssText = 'font:10px sans-serif;overflow-wrap:anywhere'; label.textContent = `${result.unified ? 'unified' : 'standalone'} ${result.name}`;
      card.append(canvas, label); captures.append(card);
    }
    document.body.append(captures);
    document.querySelector('#result').style.display = 'none';
    document.querySelector('#result').textContent = JSON.stringify({ backend: webgl ? 'webgl2' : 'webgpu', results, pickOwnership });
  </script>
</html>
