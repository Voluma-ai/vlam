<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>VLAM SH cache motion probe</title>
  <canvas id="canvas" width="16" height="16"></canvas>
  <output data-testid="result"></output>
  <script>
    window.addEventListener('error', (event) => {
      document.title = `SH cache error: ${event.message}`;
    });
    window.addEventListener('unhandledrejection', (event) => {
      document.title = `SH cache rejection: ${String(event.reason)}`;
    });
  </script>
  <script type="module">
    import * as THREE from 'three/webgpu';
    import { createWebGPURenderer, SplatMesh } from '../lib/core';
    import { shEvaluationDiagnostics } from './sh-evaluation-diagnostics';

    const output = document.querySelector('[data-testid="result"]');
    const canvas = document.querySelector('#canvas');
    const renderer = await createWebGPURenderer({
      canvas,
      antialias: false,
      requireWebGpu: true,
    });
    renderer.setSize(16, 16, false);
    renderer.setClearColor(0x000000, 0);
    await renderer.init();

    const mesh = new SplatMesh(
      {
        count: 1,
        positions: new Float32Array([0, 0, 0]),
        colors: new Uint8Array([255, 255, 255, 255]),
        covariances: new Float32Array([0.04, 0, 0, 0.04, 0, 0.04]),
        sh: {
          bands: 1,
          labels: new Uint32Array(1),
          palette: new Float32Array(192 * 4),
          paletteWidth: 192,
          paletteHeight: 1,
        },
      },
      { shEvaluation: 'compute', sortMetric: 'radial' },
    );
    const scene = new THREE.Scene();
    scene.add(mesh);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 10);
    camera.position.z = 2;
    const target = new THREE.RenderTarget(16, 16, { type: THREE.UnsignedByteType });

    const draw = () => {
      camera.updateMatrixWorld();
      mesh.update(camera, renderer);
      renderer.setRenderTarget(target);
      renderer.clear();
      renderer.render(scene, camera);
    };

    // The cache module is loaded lazily. Drive frames until its initial full
    // dispatch has completed, then translate once to create a cropped cache.
    const waitForFrames = async (ready, stage) => {
      const deadline = performance.now() + 10_000;
      do {
        draw();
        if (ready(shEvaluationDiagnostics(mesh))) return;
        await new Promise((resolve) => setTimeout(resolve, 20));
      } while (performance.now() < deadline);
      throw new Error(`SH probe did not reach ${stage}`);
    };
    await waitForFrames((state) => state.dispatches > 0, 'initial cache');
    const initial = shEvaluationDiagnostics(mesh);
    camera.position.x = 0.2;
    camera.lookAt(0, 0, 0);
    await waitForFrames(
      (state) => state.dispatches > initial.dispatches,
      'cropped cache after translation',
    );
    const beforeRotation = shEvaluationDiagnostics(mesh);

    // Radial order depends on camera position, not orientation. Rotate for
    // longer than the cache cadence without moving the camera.
    for (let attempt = 0; attempt < 30; attempt++) {
      camera.lookAt(0.05 + attempt * 0.002, 0, 0);
      draw();
      if (
        shEvaluationDiagnostics(mesh).viewCadenceRefreshes >
        beforeRotation.viewCadenceRefreshes
      )
        break;
      await new Promise((resolve) => setTimeout(resolve, 20));
    }
    const afterRotation = shEvaluationDiagnostics(mesh);
    const bytes = await renderer.readRenderTargetPixelsAsync(target, 8, 8, 1, 1);
    renderer.setRenderTarget(null);
    const result = {
      beforeRotation,
      afterRotation,
      pixel: Array.from(bytes),
    };
    output.textContent = JSON.stringify(result);
    document.title = `SH cache ${afterRotation.reason}: ${beforeRotation.dispatches}->${afterRotation.dispatches} dispatches, ${afterRotation.viewCadenceRefreshes} view refreshes, ${afterRotation.sortSubmissions - beforeRotation.sortSubmissions} rotation sorts`;
    target.dispose();
    mesh.dispose();
    renderer.dispose();
  </script>
</html>
